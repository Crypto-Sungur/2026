name: flutter_application
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  device_info_plus: ^13.3.0
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  pdf: ^3.11.0
  printing: 5.13.4
  docx_dart: ^1.2.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/logo.jpg
    - assets/splash.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.jpg"
    background_color: "#010409"
    theme_color: "#2F81F7"